[tox]
minversion = 4.11.4
env_list = \
  py314-mol251200, \
  py314-mol260200, \
  py314-mol260300, \
  py314-mol260600

#
# Usage:  tox [-e <environment>] [-- <pytest-options>]
#         tox list  # to list environments
#
[testenv]
description = Run the tests
package = wheel
wheel_build_env = .pkg
deps =
    pytest==7.4.4
    mol251200: ansible==14.0.0
    mol260200: ansible==14.0.0
    mol260300: ansible==14.0.0
    mol260600: ansible==14.0.0
    mol251200: molecule==25.12.0
    mol260200: molecule==26.2.0
    mol260300: molecule==26.3.0
    mol260600: molecule==26.6.0
passenv =
    SSH_*
    TEST_PROXMOX_*
commands =
    pytest -x -v tests {posargs}

#
# Usage:  tox -e latest [-- <pytest-options>]
#
# Examples:
#    tox -e latest -- --co           # list tests
#    tox -e latest -- -s -k default  # run the default scenario test
#
[testenv:latest]
description = Run the tests with the latest versions
basepython = python3.14
package = wheel
wheel_build_env = .pkg
deps =
    pytest==7.4.4
    ansible-core>=2.21.0
    molecule>=26.6.0
passenv =
    SSH_*
    TEST_PROXMOX_*
commands =
    pytest -x -v tests {posargs}

#
# Usage:  tox -e dev
#
# To activate the development environment:
#
#    deactivate
#    source .tox/dev/bin/activate
#
# Then run molecule in the tests directory:
#
#    cd tests
#    BOX=<box> BOX_VERSION=<version> molecule test [-s <scenario>]
#    cd ..
#
# Or run the tests with pytest:
#
#    pytest --co tests            # list tests
#    pytest -v [-k <pattern>] tests # run tests
#
[testenv:dev]
description = Development environment
basepython = python3.12
usedevelop = True
deps =
    pytest==7.4.4
    ansible==10.4.0
    molecule==24.9.0
passenv =
    SSH_*
    TEST_PROXMOX_*
commands =

#
# Usage:  tox -e lint
#
[testenv:lint]
description = Run static checks
basepython = python3.12
setenv =
    ANSIBLE_LIBRARY = src/molecule_proxmox
deps =
    ansible==10.4.0
    ansible-lint==6.22.2
    collective.checkdocs==0.2
    flake8==7.0.0
    pyflakes==3.2.0
    pylint==3.0.3
    setuptools==69.0.3
    yamllint==1.33.0
commands =
    pyflakes src tests
    flake8 src tests
    yamllint src tests
    ansible-lint src/molecule_proxmox/playbooks
    python setup.py -q checkdocs

#
# Usage:  tox -e docs
#
[testenv:docs]
description = Build documentation
basepython = python3.12
changedir = docs
deps =
    Sphinx==7.2.6
    sphinx-rtd-theme==2.0.0
commands =
    sphinx-build -M html source build

#
# Usage:  tox -e build
#
[testenv:build]
description = Build python package
basepython = python3
deps =
    build==1.2.2
commands =
    python -m build

#
# Usage:  tox -e release
#
# Note: Set TWINE env vars or ~/.pypirc before running.
#
[testenv:release]
description = Upload release to pypi
basepython = python3
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY_URL
deps =
    build==1.2.2
    twine==6.1.0
commands =
    python -m build
    twine check dist/*
    twine upload --repository molecule-proxmox --skip-existing dist/*
